<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledger — on-chain invoicing</title>
    <!-- Thebes SDK runtimes (window.EgyptBoundary / window.MemphisPasskey),
         synced from @thebes/sdk into public/ at build time. -->
    <script src="./boundary.js"></script>
    <!-- Memphis passkey auth client (window.MemphisPasskey) + the BIP39
         recovery module (window.MemphisRecovery). Since MIN_FACTORS_AT_SIGNUP
         rose to 3, a new identity needs the recovery phrase as its third
         factor, so recovery.js is required for signup, not optional. -->
    <script src="./recovery.js"></script>
    <script src="./passkey.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
